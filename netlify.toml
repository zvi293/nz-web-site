[build]
  command = "npm run build"
  publish = "dist"

# ── Canonical redirect: www → non-www ──
[[redirects]]
  from = "https://www.nz-web.com/*"
  to   = "https://nz-web.com/:splat"
  status = 301
  force  = true

# ── Client-only routes that are NOT pre-rendered to static files must still
#    resolve on a direct load / refresh, so they get an explicit SPA fallback
#    (200). These are all noindex / robots-disallowed, so serving the shell is
#    correct. Pre-rendered files (everything else) take precedence over these
#    rules and are served directly. ──
#
#    /blog/*    — blog posts (an unknown slug renders the in-app "not found"
#                 with noindex instead of a hard 404 mid-navigation).
#    /thank-you — post-submit page (robots-disallowed, reached via client nav).
[[redirects]]
  from   = "/blog/*"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/thank-you"
  to     = "/index.html"
  status = 200

# NOTE: there is intentionally NO global "/* → /index.html 200" catch-all.
# Every real content route is pre-rendered to its own dist/<route>/index.html
# and served directly. Any other unmatched path now falls through to
# dist/404.html, which Netlify returns with a genuine HTTP 404 (generated by
# scripts/prerender.mjs). This removes the previous soft-404 where unknown URLs
# returned 200. IMPORTANT: any future client-only (non-pre-rendered) route must
# be added here, or it will correctly 404 on direct load.

# ── Security + SEO headers for all pages ──
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Content-Security-Policy for a fully static site.
    #  - script-src: the bundle itself; GA + Meta Pixel load only after cookie
    #    consent, so their hosts must be allowed here. 'unsafe-inline' is required
    #    because the pre-rendered pages carry inline JSON-LD-adjacent bootstrap
    #    and GA's gtag snippet is inline-invoked; there is no server to mint nonces.
    #  - style-src 'unsafe-inline': React/framer-motion set inline styles.
    #  - frame-ancestors mirrors X-Frame-Options for modern browsers.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.google-analytics.com https://www.googletagmanager.com https://www.facebook.com; font-src 'self'; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://www.facebook.com; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; frame-ancestors 'self'; upgrade-insecure-requests"

# ── Long cache for assets ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Self-hosted fonts — versioned by filename, safe to cache forever ──
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Service videos — large and rarely change ──
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ── Static files cache ──
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control   = "public, max-age=86400"
    Content-Type    = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
