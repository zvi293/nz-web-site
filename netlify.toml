[build]
  command = "npm run build"
  publish = "dist"

# ── Canonical redirect: www → non-www ──
[[redirects]]
  from = "https://www.nz-web.com/*"
  to   = "https://nz-web.com/:splat"
  status = 301
  force  = true

# ── Client-only routes that are NOT pre-rendered to static files must still
#    resolve on a direct load / refresh, so they get an explicit SPA fallback
#    (200). These are all noindex / robots-disallowed, so serving the shell is
#    correct. Pre-rendered files (everything else) take precedence over these
#    rules and are served directly. ──
#
#    /blog/*    — dynamic posts (a post published between builds has no file yet;
#                 unknown slugs render the in-app "not found" with noindex).
#    /admin/*   — admin login + portfolio (client-only, never pre-rendered).
#    /thank-you — post-submit page (robots-disallowed, reached via client nav).
[[redirects]]
  from   = "/blog/*"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/admin/*"
  to     = "/index.html"
  status = 200

[[redirects]]
  from   = "/thank-you"
  to     = "/index.html"
  status = 200

# NOTE: there is intentionally NO global "/* → /index.html 200" catch-all.
# Every real content route is pre-rendered to its own dist/<route>/index.html
# and served directly. Any other unmatched path now falls through to
# dist/404.html, which Netlify returns with a genuine HTTP 404 (generated by
# scripts/prerender.mjs). This removes the previous soft-404 where unknown URLs
# returned 200. IMPORTANT: any future client-only (non-pre-rendered) route must
# be added here, or it will correctly 404 on direct load.

# ── Security + SEO headers for all pages ──
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# ── Long cache for assets ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Static files cache ──
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control   = "public, max-age=86400"
    Content-Type    = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
