[build]
  command = "npm run build"
  publish = "dist"

# Astro 7 needs Node >= 22.23.4 (package engines); pin the build image's Node.
[build.environment]
  NODE_VERSION = "24"

# ── Serverless functions ──
# netlify/functions/deploy-succeeded.js is an EVENT function: Netlify runs it after every
# successful deploy; on production it submits the sitemap URLs to IndexNow (Bing / ChatGPT
# Search / Copilot). It is an ES module (package.json "type": "module"), hence esbuild.
[functions]
  directory    = "netlify/functions"
  node_bundler = "esbuild"

# ── Canonical redirect: www → non-www ──
[[redirects]]
  from = "https://www.nz-web.com/*"
  to   = "https://nz-web.com/:splat"
  status = 301
  force  = true

# ── Function sources are never served as files (functions run from /.netlify/functions/). ──
[[redirects]]
  from   = "/netlify/*"
  to     = "/404.html"
  status = 404
  force  = true

# NOTE: there is intentionally NO "/* → /index.html 200" catch-all and no SPA fallback.
# The site is a static multi-page Astro build: every URL is its own dist/<path>/index.html.
# Any other path falls through to dist/404.html, which Netlify returns with a real HTTP 404.

# ══════════════════════════════════ HEADERS ══════════════════════════════════
# Netlify applies EVERY [[headers]] block whose path matches a request. Keep each header name
# in one matching block only (the same name in "/*" and in a narrower path can end up as one
# comma-joined value, e.g. a broken Cache-Control or CORP). "/*" owns the security headers; the
# narrower blocks below only add Cache-Control / Content-Type / X-Robots-Tag.

# ── Security headers for every response ──
# Content-Security-Policy is NOT set here: scripts/postbuild.mjs writes it to dist/_headers on
# every build (Netlify applies _headers from the publish dir), because script-src must list the
# sha256 of each inline script Astro emits (island runtime + BaseLayout's boot script). Keep the
# header in ONE place only — never also here or as a <meta> (policies stack and block things).
# The rest of the policy (style-src 'unsafe-inline', GA/Meta hosts after consent, form-action
# wa.me, frame-ancestors 'none'…) lives in scripts/postbuild.mjs (CSP_REST / SCRIPT_HOSTS).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security    = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options              = "DENY"
    X-Content-Type-Options       = "nosniff"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), display-capture=(), idle-detection=(), browsing-topics=(), fullscreen=(self)"
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# ── Hashed build output (Astro build.assets = "assets") and self-hosted fonts: cache forever ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Per-page social cards (public/og/*.jpg): not hashed, so a day and revalidate ──
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Crawler / AI text files: explicit UTF-8 so Hebrew is read correctly ──
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/humans.txt"
  [headers.values]
    Content-Type  = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# ── IndexNow key file (file name = key; see netlify/functions/deploy-succeeded.js).
#    Search engines fetch it to verify submissions; keep it out of search results. ──
[[headers]]
  for = "/b4de74f617e50be05dfea2e84c50902a.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type  = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type  = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=86400"
