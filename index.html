<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>NZ-web | Full Stack, UI/UX, and AI Studio</title>
    <meta
      name="description"
      content="NZ-web studio for websites, landing pages, full-stack development, UI/UX, and AI automations."
    />
    <meta
      name="keywords"
      content="NZ-web, full stack, UI UX, AI automation, websites, landing pages, React, TypeScript"
    />
    <meta name="author" content="NZ-web" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <!-- TODO: Set the final production domain before launch. -->

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NZ-web" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:title" content="NZ-web | Full Stack, UI/UX, and AI Studio" />
    <meta
      property="og:description"
      content="NZ-web studio for websites, landing pages, full-stack development, UI/UX, and AI automations."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NZ-web | Full Stack, UI/UX, and AI Studio" />
    <meta
      name="twitter:description"
      content="NZ-web studio for websites, landing pages, full-stack development, UI/UX, and AI automations."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/placeholder.svg" />

    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://wa.me" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "NZ-web",
        "alternateName": "NZ-WEB",
        "description": "Studio for websites, full-stack development, UI/UX, and AI automations.",
        "founder": {
          "@type": "Person",
          "name": "Zvi Moshe",
          "jobTitle": "Full Stack Developer and UI/UX Expert"
        },
        "areaServed": {
          "@type": "Country",
          "name": "Israel"
        },
        "serviceType": [
          "Websites",
          "Applications",
          "UI/UX",
          "AI Automation",
          "Full Stack",
          "Landing Pages"
        ],
        "knowsAbout": [
          "React",
          "TypeScript",
          "Node.js",
          "Tailwind CSS",
          "Supabase",
          "UI/UX Design",
          "AI Automation"
        ],
        "slogan": "Perfect in every Pixel",
        "inLanguage": ["he", "en"],
        "sameAs": []
      }
    </script>

    <!-- WebSite schema for search box -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NZ-web",
        "inLanguage": "he",
        "description": "NZ-web studio for websites, full-stack development, UI/UX, and AI automations."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
